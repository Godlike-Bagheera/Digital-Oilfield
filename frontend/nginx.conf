server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: все пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API, админка и статика Django уходят в контейнер backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
